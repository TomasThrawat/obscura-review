version: 2.1

jobs:
  rust-review:
    docker:
      - image: amazonlinux:2023
    environment:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - checkout
      - run:
          name: Install native dependencies and Rust toolchain
          command: |
            dnf install -y gcc gcc-c++ make cmake clang clang-devel llvm-devel pkgconf-pkg-config ca-certificates git gzip tar
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            mkdir -p "$HOME/.cargo/bin"
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
            source "$HOME/.cargo/env"
            rustc --version
            cargo --version
            getconf GNU_LIBC_VERSION
      - restore_cache:
          keys:
            - cargo-registry-v1-{{ checksum "Cargo.lock" }}
            - cargo-registry-v1-
      - run:
          name: Install prebuilt cargo-nextest
          command: |
            source "$HOME/.cargo/env"
            curl --proto '=https' --tlsv1.2 -LsSf https://get.nexte.st/0.9/linux | tar zxf - -C "$HOME/.cargo/bin"
            cargo-nextest --version
      - run:
          name: Install prebuilt cargo-deny
          command: |
            source "$HOME/.cargo/env"
            archive=/tmp/cargo-deny-0.20.2.tar.gz
            curl --proto '=https' --tlsv1.2 -fL --retry 3               https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz               -o "$archive"
            mkdir -p /tmp/cargo-deny-unpack
            tar -xzf "$archive" -C /tmp/cargo-deny-unpack
            find /tmp/cargo-deny-unpack -type f -name cargo-deny -exec install -m 0755 {} "$HOME/.cargo/bin/cargo-deny" \;
            cargo-deny --version
      - run:
          name: Dependency security, licensing, and source policy
          command: |
            source "$HOME/.cargo/env"
            cargo deny check
      - run:
          name: Release build with renderer
          no_output_timeout: 30m
          command: |
            source "$HOME/.cargo/env"
            cargo build --release -p obscura-cli --bins --features render
      - run:
          name: Rust test suite using nextest
          no_output_timeout: 30m
          command: |
            source "$HOME/.cargo/env"
            cargo nextest run --release --features render --no-fail-fast
            cargo test --release --doc --workspace
      - run:
          name: Binary smoke test and dynamic-library check
          command: |
            source "$HOME/.cargo/env"
            ./target/release/obscura --version
            ldd target/release/obscura
            if ldd target/release/obscura | grep -q "not found"; then
              echo "A required shared library is missing."
              exit 1
            fi
      - save_cache:
          key: cargo-registry-v1-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
      - store_artifacts:
          path: target/release/obscura
          destination: obscura-release-binary

workflows:
  review:
    jobs:
      - rust-review
